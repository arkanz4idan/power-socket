[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "power-socket"
version = "0.2.0"
description = "A universal terminal client for local and remote AI services."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["textual==8.2.7"]

[project.scripts]
power-socket = "cavde_connect.__main__:cli"

[tool.setuptools.packages.find]
include = ["cavde_connect*"]
