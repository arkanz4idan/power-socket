[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "power-socket"
version = "0.2.0"
description = "A universal terminal client for local and remote AI services."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["textual==8.2.7", "google-api-python-client>=2.160,<3", "google-auth-oauthlib>=1.2,<2", "requests>=2.32,<3"]

[project.scripts]
power-socket = "power_socket.__main__:cli"

[tool.setuptools.packages.find]
include = ["power_socket*"]
